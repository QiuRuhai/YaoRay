[render]
backend = "cpu"
width = 64
height = 32

[film]
output = "out/obj_quad.png"

[camera]
type = "perspective"
position = [0, 0, 4]
target = [0, 0, 0]
fov_y = 60

[[assets]]
name = "quad"
path = "../assets/quad.obj"

[[materials]]
name = "matte_quad"
albedo = [0.55, 0.7, 0.85]
emission = [0, 0, 0]

[[instances]]
asset = "quad"
material = "matte_quad"
translate = [0, 0, 0]
rotate_degrees = [0, 0, 0]
scale = [1, 1, 1]

[[lights]]
type = "area"
position = [0, 1.5, 2]
size = [1, 1]
radiance = [6, 6, 6]

[environment]
type = "constant"
radiance = [0.02, 0.02, 0.02]
