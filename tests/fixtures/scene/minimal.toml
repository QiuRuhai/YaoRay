[render]
backend = "cpu"
width = 1280
height = 720
spp = 64
max_depth = 8
seed = 42

[film]
output = "out/example.png"
tone_mapper = "aces"
exposure = 0.0
checkpoint_interval_s = 0
checkpoint_path = ""

[camera]
type = "perspective"
position = [0, 1, 4]
target = [0, 1, 0]
fov_y = 45
aperture = 0.0
focus_distance = 4.0

[[assets]]
name = "model"
path = "assets/models/model.glb"

[[instances]]
asset = "model"
translate = [0, 0, 0]
rotate_degrees = [0, 0, 0]
scale = [1, 1, 1]

[[lights]]
type = "area"
position = [0, 4, 2]
size = [2, 2]
radiance = [8, 7, 6]

[environment]
type = "constant"
radiance = [0.02, 0.025, 0.03]
strength = 1.0
