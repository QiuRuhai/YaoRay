[render]
backend = "cpu"
width = 64
height = 32

[film]
output = "out/builtin.png"

[camera]
type = "perspective"
position = [0, 0, 4]
target = [0, 0, 0]
fov_y = 60

[[assets]]
name = "triangle"
path = "builtin:triangle"

[[instances]]
asset = "triangle"
translate = [0, 0, 0]
rotate_degrees = [0, 0, 0]
scale = [1, 1, 1]

[[lights]]
type = "area"
position = [0, 0, 2]
size = [1, 1]
radiance = [4, 4, 4]

[environment]
type = "constant"
radiance = [0.02, 0.02, 0.02]
