[render]
backend = "cpu"
integrator = "path"
width = 640
height = 480
spp = 16
max_depth = 6
seed = 42
sampler = "stratified"
threads = 0
light_samples = 2

[film]
output = "out/gltf_flight_helmet.png"
tone_mapper = "aces"
exposure = 0.0

[camera]
type = "perspective"
position = [0.0, 0.45, 1.35]
target = [0.0, 0.35, 0.0]
fov_y = 35.0

[[assets]]
name = "flight_helmet"
path = "assets/gltf/FlightHelmet/glTF/FlightHelmet.gltf"

[[instances]]
asset = "flight_helmet"

[[lights]]
type = "area"
position = [0.0, 1.5, 1.0]
size = [1.5, 1.5]
radiance = [8.0, 8.0, 8.0]

[environment]
type = "constant"
radiance = [0.02, 0.022, 0.025]
strength = 1.0
