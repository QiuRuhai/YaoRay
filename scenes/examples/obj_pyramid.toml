[render]
backend = "cpu"
width = 640
height = 360
spp = 1
max_depth = 5
seed = 1

[film]
output = "out/obj_pyramid.png"
tone_mapper = "aces"
exposure = 0.0

[camera]
type = "perspective"
position = [0, 0.3, 5]
target = [0, 0, 0]
fov_y = 45

[[assets]]
name = "pyramid"
path = "assets/pyramid.obj"

[[materials]]
name = "matte_stone"
albedo = [0.65, 0.7, 0.75]
emission = [0, 0, 0]

[[instances]]
asset = "pyramid"
material = "matte_stone"
translate = [0, 0, 0]
rotate_degrees = [0, 0, 0]
scale = [1, 1, 1]

[[lights]]
type = "area"
position = [0, 2.5, 3]
size = [2, 2]
radiance = [8, 8, 8]

[environment]
type = "constant"
radiance = [0.02, 0.025, 0.03]
strength = 1.0
