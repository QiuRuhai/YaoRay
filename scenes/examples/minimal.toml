[render]
backend = "cpu"
width = 640
height = 360
spp = 1
max_depth = 5
seed = 42

[film]
output = "out/minimal.png"
tone_mapper = "aces"
exposure = 0.0

[camera]
type = "perspective"
position = [0, 0, 4]
target = [0, 0, 0]
fov_y = 60

[[assets]]
name = "triangle"
path = "builtin:triangle"

[[materials]]
name = "warm_triangle"
albedo = [0.9, 0.45, 0.25]
emission = [0, 0, 0]

[[instances]]
asset = "triangle"
material = "warm_triangle"
translate = [0, 0, 0]
rotate_degrees = [0, 0, 0]
scale = [1, 1, 1]

[[lights]]
type = "area"
position = [0, 0, 2]
size = [2, 2]
radiance = [4, 4, 4]

[environment]
type = "constant"
radiance = [0.02, 0.025, 0.03]
strength = 1.0
