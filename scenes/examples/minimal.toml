[render]
backend = "cpu"
width = 640
height = 360
spp = 1
max_depth = 5
seed = 42

[film]
output = "out/minimal.ppm"
tone_mapper = "aces"
exposure = 0.0

[camera]
type = "perspective"
position = [0, 0, 4]
target = [0, 0, 0]
fov_y = 60

[[assets]]
name = "triangle"
path = "builtin:triangle"

[[instances]]
asset = "triangle"
translate = [0, 0, 0]
rotate_degrees = [0, 0, 0]
scale = [1, 1, 1]

[environment]
type = "constant"
radiance = [0.02, 0.025, 0.03]
strength = 1.0
